<html>

<head>
    <title>Registration Page</title>

    <style>
        body {
            background-color: yellow;
        }

        h1 {
            text-align: center;
        }

        ul {
            list-style: none;
        }

        ul li {
            display: inline;
            margin-right: 30px;
        }

        ul li a {
            text-decoration: none;
        }

        #image {
            width: 48%;
            height: 400px;
            border: 2px solid black;
            float: left;
        }

        #reg {
            width: 48%;
            height: 400px;
            border: 2px solid black;
            float: right;
        }

        #reg h2 {
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>WELCOME TO SVCET</h1>

    <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="register.html">Register</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="contact.html">Contact Us</a></li>
        <li><a href="about.html">About Us</a></li>
    </ul>

    <div id="image">
        <img src="https://play-lh.googleusercontent.com/XJwP22y5BcUQppxEOt_iDjGd1gzWUaVjrTu_Y7Rui5MckgWRDkGHvW6sedDxhl_zy6I0ycJE62GEsKMvOpBGcu4" width="100%" height="100%">
    </div>

    <div id="reg">

        <h2>Register Here</h2>

        <form action="db.html" method="post">

            <table>

                <tr>
                    <td>User Name :</td>
                    <td>
                        <input type="text" required>
                    </td>
                </tr>

                <tr>
                    <td>Password :</td>
                    <td>
                        <input type="password" required>
                    </td>
                </tr>

                <tr>
                    <td>Email-id :</td>
                    <td>
                        <input type="email" required>
                    </td>
                </tr>

                <tr>
                    <td>Mobile No :</td>
                    <td>
                        <input type="number" required>
                    </td>
                </tr>

                <tr>
                    <td>Address :</td>
                    <td>
                        <input type="text" required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="submit">
                    </td>
                    <td>
                        <input type="reset">
                    </td>
                </tr>

            </table>

        </form>

    </div>

</body>

</html>
